[package]
name = "ptacek"
version = "0.1.5"
description = "Transformuj Ptáček — macOS overlay notifikace schůzek"
authors = ["Transformuj.ai"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
tauri = { version = "1.5.4", features = [
    "macos-private-api",
    "system-tray",
    "window-show",
] }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
mouse_position = "0.1.3"
log = "^0.4.20"
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tokio = { version = "1", features = ["time", "sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
ical = "0.11"
# apple-native je POVINNÉ: keyring 3.x bez features je jen mock v paměti
# procesu — URL by nepřežila restart a nikdy by nebyla v reálné Klíčence.
keyring = { version = "3", features = ["apple-native"] }
futures-util = "0.3"
fs2 = "0.4"
rrule = "0.13"
# stejná verze, jakou používá rrule — kvůli jednotné TZ databázi
chrono-tz = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-event-kit = "0.3"
block2 = "0.6"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
